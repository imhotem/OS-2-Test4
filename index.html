<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學員資料管理系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding: 40px 15px;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            padding: 30px 25px;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            color: #000;
        }
        .top-btn-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-switch {
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #0066ff;
            padding: 10px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,102,255,0.15);
            transition: all 0.2s ease;
        }
        .btn-switch:hover {
            background-color: #0066ff;
            color: #ffffff;
        }
        .page { display: none; }
        .page.active { display: block; }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            color: #4c35b5;
            padding-bottom: 8px;
            border-bottom: 2.5px solid #2563eb;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 15px;
            color: #4b5563;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .btn-submit {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 19px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #15803d; }
        .btn-cancel {
            width: 100%;
            background-color: #6b7280;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            display: none;
        }
        .btn-cancel:hover { background-color: #4b5563; }
        .table-container {
            margin-top: 10px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            font-size: 16px;
            color: #4b5563;
            text-align: left;
            padding: 12px 8px;
            border-bottom: 2px solid #e5e7eb;
        }
        td {
            padding: 14px 8px;
            font-size: 16px;
            color: #111827;
            border-bottom: 1px solid #f3f4f6;
        }
        td.student-id {
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .btn-edit {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-edit:hover { background-color: #1d4ed8; }
        .empty-msg {
            text-align: center;
            color: #9ca3af;
            padding: 30px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-btn-container">
        <button type="button" id="toggleBtn" class="btn-switch">學生資料瀏覽</button>
    </div>

    <!-- 頁面1: 新增/修改介面 -->
    <div id="addPage" class="page active">
        <h1 id="formPageTitle">學員資料新增介面</h1>
        <div class="card-title">
            <span id="formCardTitle">新增學員資料</span>
        </div>
        <form id="studentForm">
            <div class="form-grid">
                <div class="form-group">
                    <label>編號(主鍵不可修改)</label>
                    <input type="text" id="sid" placeholder="例:A02" required>
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="sname" placeholder="例:王小明" required>
                </div>
                <div class="form-group">
                    <label>性別</label>
                    <select id="sgender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>學校</label>
                    <input type="text" id="sschool" placeholder="例:建國學府" required>
                </div>
                <div class="form-group">
                    <label>年級</label>
                    <input type="text" id="sgrade" placeholder="例:2年級">
                </div>
                <div class="form-group">
                    <label>班級</label>
                    <input type="text" id="sclass" placeholder="例:201">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">確認新增</button>
            <button type="button" id="cancelBtn" class="btn-cancel">取消修改</button>
        </form>
    </div>

    <!-- 頁面2: 瀏覽介面 -->
    <div id="listPage" class="page">
        <h1>學員資料瀏覽介面</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>編號</th>
                        <th>姓名</th>
                        <th>性別</th>
                        <th>學校</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
